name: windows-ci

# Turns the local release checks (pytest -> PyInstaller -> frozen --self-check)
# into a visible GitHub gate. The Inno Setup installer stays a local step
# (tools/build.ps1) — see workbench/beta1-release and CLAUDE.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

      - name: Build frozen bundle (PyInstaller onedir)
        run: pyinstaller PokeFollower.spec --noconfirm

      - name: Frozen self-check (release gate)
        run: .\dist\PokeFollower\PokeFollower.exe --self-check

      - name: Upload frozen bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PokeFollower-frozen-${{ github.sha }}
          path: dist/PokeFollower/
          retention-days: 14
          if-no-files-found: error
